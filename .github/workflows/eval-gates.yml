name: SbD Agent Eval Gates

on:
  push:
    paths:
      - "sbd-agent/**"
      - ".github/workflows/eval-gates.yml"
  pull_request:
    paths:
      - "sbd-agent/**"
      - ".github/workflows/eval-gates.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: sbd-agent

jobs:
  eval-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Unit tests
        run: pytest -q
      - name: Golden-set evaluation (quality + latency + cost SLOs)
        run: |
          python -m eval.harness \
            --out configs/agent_versions/last_eval_report.json \
            --fail-on-gate
      - name: Promote to staging when gates pass
        run: |
          python -m sbd_agent.mlops.promote \
            --version v1.1.0 \
            --env staging \
            --eval-report configs/agent_versions/last_eval_report.json
      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: sbd-eval-report
          path: sbd-agent/configs/agent_versions/
